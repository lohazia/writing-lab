<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>복합양식 글쓰기 편집실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* 배치: 위쪽 단계 띠 + 한 단계씩 넘기는 작업 책상. 표현하기만 2단(편집기 | 개요 참고) */
  --bg:#f1f5f2; --surface:#ffffff; --ink:#1b2a31; --muted:#586b73; --line:#d3ddd9;
  --accent:#1c7a54; --accent-ink:#ffffff; --accent-soft:#def1e6; --mark:#ffe27a;
  --warn:#b8402a; --warn-soft:#fbe7e1;
  --display:"Do Hyeon","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11181b; --surface:#1a2428; --ink:#e5eeea; --muted:#9db1ad; --line:#2e3c41;
    --accent:#5fc798; --accent-ink:#0d1a14; --accent-soft:#1c392c; --mark:#7a6412;
    --warn:#f09079; --warn-soft:#3a211b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11181b; --surface:#1a2428; --ink:#e5eeea; --muted:#9db1ad; --line:#2e3c41;
  --accent:#5fc798; --accent-ink:#0d1a14; --accent-soft:#1c392c; --mark:#7a6412;
  --warn:#f09079; --warn-soft:#3a211b; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 64px}
header.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:16px 0 10px}
.brand{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.brand h1{font-size:1.7rem}
.brand span{color:var(--muted);font-size:.9rem}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:5px}
.dot.off{background:var(--warn)}
nav.steps{display:flex;gap:6px;overflow-x:auto;padding:6px 0 12px;align-items:center}
.lesson{flex:none;font-family:var(--display);font-size:.95rem;color:var(--muted);padding:0 4px 0 8px}
.lesson:first-child{padding-left:0}
.stepbtn{flex:none;display:flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.9rem;white-space:nowrap}
.stepbtn .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--bg);font-size:.75rem;font-variant-numeric:tabular-nums}
.stepbtn.done .n{background:var(--accent);color:var(--accent-ink)}
.stepbtn.cur{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.stepbtn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 220px;min-width:0}
.head{display:flex;gap:10px 16px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
.head h2{font-size:1.5rem}
.head .meta{color:var(--muted);font-size:.88rem}
.lead{color:var(--muted);max-width:65ch}
.keyq{background:var(--mark);color:#2b2300;border-radius:10px;padding:10px 14px;font-weight:500}
:root[data-theme="dark"] .keyq{color:#fff3c2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .keyq{color:#fff3c2}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.9rem;font-weight:500}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],input[type=url],textarea,select{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:9px 11px;font-weight:400}
textarea{resize:vertical;min-height:64px;line-height:1.6}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.danger{color:var(--warn)}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:4px}
.todo{background:var(--warn-soft);border-radius:10px;padding:10px 14px;font-size:.9rem}
.todo b{color:var(--warn)}
.ok{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:.9rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.arrow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.arrow .ar{font-family:var(--display);color:var(--accent);padding-bottom:10px}
@media (max-width:640px){.grid2,.arrow{grid-template-columns:1fr}.arrow .ar{padding:0;transform:rotate(90deg);justify-self:center}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.9rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.q{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.q .fb{font-size:.9rem;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}
.idea{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.idea.on{border-color:var(--accent);background:var(--accent-soft)}
.idea span{flex:1;min-width:0;overflow-wrap:anywhere}
.otable{display:flex;flex-direction:column;gap:10px}
.orow{display:grid;grid-template-columns:56px 1.2fr 1fr;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px;align-items:start}
.orow .part{font-family:var(--display);font-size:1.1rem;color:var(--accent);padding-top:6px}
@media (max-width:720px){.orow{grid-template-columns:1fr}}
.editor{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.editor{grid-template-columns:1fr}}
.side{position:sticky;top:8px;font-size:.9rem}
.side h3{font-size:1.05rem;margin-bottom:6px}
.side dl{margin:0;display:flex;flex-direction:column;gap:8px}
.side dt{font-weight:600;color:var(--accent)}
.side dd{margin:0;overflow-wrap:anywhere}
.block{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.block .bh{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:.78rem;border-radius:6px;padding:2px 8px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.block img{max-width:100%;max-height:260px;border-radius:8px;align-self:flex-start}
.addbar{border:1px dashed var(--line);border-radius:12px;padding:12px}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.88rem}
table.chk{width:100%;border-collapse:collapse;font-size:.92rem}
table.chk th,table.chk td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle}
table.chk th{color:var(--muted);font-weight:500;font-size:.85rem}
.tablebox{overflow-x:auto}
.rate{display:flex;gap:4px}
.rate button{width:36px;height:32px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer}
.rate button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.auto li{margin:2px 0}
.auto .bad{color:var(--warn);font-weight:500}
.peerbar{background:var(--mark);color:#2b2300;border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
/* 누리집 미리보기: 종이처럼 항상 밝게 */
.site{background:#fff;color:#1d262b;border:1px solid #cfd8d4;border-radius:12px;overflow:hidden}
.site .bar{background:#1c7a54;color:#fff;padding:8px 16px;font-size:.85rem;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.site article{padding:24px;max-width:68ch;margin:0 auto}
.site h2{font-size:1.8rem;margin-bottom:4px;color:#1d262b}
.site .by{color:#66757c;font-size:.88rem;margin-bottom:16px}
.site p{margin:0 0 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.site figure{margin:0 0 16px}
.site figure img{max-width:100%;border-radius:8px;display:block}
.site figcaption{font-size:.85rem;color:#66757c;margin-top:4px}
.site .media{border:1px solid #cfd8d4;border-radius:10px;padding:10px 14px;margin:0 0 16px;background:#f3f7f5;overflow-wrap:anywhere}
.site .media a{color:#1c7a54}
.site .player{position:relative;aspect-ratio:16/9;margin:8px 0}
.site .player.audio{aspect-ratio:auto;height:200px}
.site .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:8px}
.site audio{display:block;width:100%;margin:8px 0}
.site video{display:block;max-width:100%;margin:8px 0;border-radius:8px}
.site .media small{color:#66757c}
.site .src{border-top:1px solid #cfd8d4;margin-top:20px;padding-top:10px;font-size:.85rem;color:#66757c}
.site .src ol{margin:4px 0 0;padding-left:20px}
.prog{display:inline-flex;gap:2px;vertical-align:middle}
.prog i{width:9px;height:14px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--accent)}
table.chk td.num{text-align:right;font-variant-numeric:tabular-nums}
table.chk .bad{color:var(--warn);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.tile b{display:block;font-family:var(--display);font-size:1.6rem;font-weight:400;line-height:1.2}
.tile span{font-size:.85rem;color:var(--muted)}
/* 완성 글 웹페이지: 학생이 고른 분위기에 따라 색이 정해지고, 화면 테마와는 따로 움직인다 */
.essay{--e-bg:#f6f1e7;--e-ink:#2b2a27;--e-sub:#7b7468;--e-line:#ddd3c0;--e-acc:#8a5a44;--e-card:#efe7d8;
  background:var(--e-bg);color:var(--e-ink);border-radius:18px;overflow:hidden;font-family:"Gowun Batang","Nanum Myeongjo","Batang",serif;box-shadow:0 18px 40px -24px rgba(0,0,0,.45)}
.essay.t-night{--e-bg:#141a2b;--e-ink:#ebe7df;--e-sub:#9ba5bb;--e-line:#2c3552;--e-acc:#e6c27c;--e-card:#1c2439}
.essay.t-spring{--e-bg:#f2f7f1;--e-ink:#25332b;--e-sub:#6a7e72;--e-line:#d2e0d4;--e-acc:#cf6f85;--e-card:#e6f0e7}
.essay .in{max-width:680px;margin:0 auto;padding:56px 28px 44px}
.essay .eyebrow{font-family:var(--body);font-size:.78rem;letter-spacing:.14em;color:var(--e-sub);display:flex;gap:10px;align-items:center}
.essay .eyebrow::before{content:"";width:34px;height:2px;background:var(--e-acc)}
.essay h2{font-family:inherit;font-weight:700;font-size:clamp(1.9rem,4.6vw,2.9rem);line-height:1.3;letter-spacing:-.01em;margin:18px 0 10px;color:var(--e-ink);word-break:keep-all;overflow-wrap:break-word;text-wrap:balance}
.essay .topic{color:var(--e-acc);font-size:1.02rem}
.essay .by{font-family:var(--body);font-size:.86rem;color:var(--e-sub);margin-top:22px;padding-bottom:22px;border-bottom:1px solid var(--e-line)}
.essay .eb{padding-top:30px;font-size:1.09rem;line-height:2.05}
.essay .eb p{margin:0 0 1.5em;white-space:pre-wrap;word-break:keep-all;overflow-wrap:break-word}
.essay .eb p.lead1{font-size:1.14em;line-height:1.95}
.essay figure{margin:2.2em 0}
.essay figure img{display:block;max-width:100%;margin:0 auto;border-radius:6px;box-shadow:0 14px 30px -18px rgba(0,0,0,.6)}
.essay figcaption,.essay .mcap{font-family:var(--body);font-size:.84rem;line-height:1.6;color:var(--e-sub);margin-top:12px;text-align:center}
.essay figcaption b,.essay .mcap b{color:var(--e-acc);font-weight:600;margin-right:6px}
.essay .em{margin:2.2em 0}
.essay .player{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;box-shadow:0 14px 30px -18px rgba(0,0,0,.6)}
.essay .player.audio{aspect-ratio:auto;height:180px}
.essay .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.essay audio{display:block;width:100%}
.essay video{display:block;max-width:100%;margin:0 auto;border-radius:12px}
.essay .linkcard{display:block;background:var(--e-card);border:1px solid var(--e-line);border-radius:12px;padding:14px 18px;font-family:var(--body);font-size:.9rem;color:var(--e-ink);text-decoration:none;overflow-wrap:anywhere}
.essay .linkcard span{display:block;color:var(--e-acc);font-size:.8rem;margin-bottom:2px}
.essay .mcap a{color:var(--e-sub)}
.essay .end{text-align:center;color:var(--e-acc);letter-spacing:.6em;margin:2.4em 0 1.6em}
.essay .esrc{font-family:var(--body);font-size:.82rem;line-height:1.7;color:var(--e-sub);border-top:1px solid var(--e-line);padding-top:16px}
.essay .esrc ol{margin:6px 0 0;padding-left:20px}
.essay .empty{color:var(--e-sub)}
@media (max-width:520px){.essay .in{padding:36px 20px 32px}.essay .eb{font-size:1.02rem;line-height:1.95}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.92rem;z-index:20;max-width:calc(100% - 32px)}
.hide{display:none!important}
ol.plan{margin:0;padding-left:20px;color:var(--muted)}
.sheet{background:#fff;color:#1d262b;font-family:var(--body);font-size:15px;line-height:1.6;padding:8px}
.sheet.shot{position:absolute;left:-10000px;top:0;width:794px}
.sheet .sec{padding:0 0 12px;break-inside:avoid}
.sheet h1{font-family:var(--body);font-weight:600;font-size:1.2rem;margin:0 0 4px}
.sheet h2{font-family:var(--body);font-weight:600;font-size:1rem;border-left:5px solid #1c7a54;padding-left:8px;margin:0 0 6px}
.sheet table{width:100%;border-collapse:collapse;font-size:.9rem}
.sheet th,.sheet td{border:1px solid #aab7b2;padding:6px 8px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.sheet th{background:#eef4f1;white-space:nowrap}
.sheet p{margin:0 0 6px;white-space:pre-wrap;overflow-wrap:anywhere}
.sheet img{max-width:100%;max-height:420px;display:block}
.sheet .cap{font-size:.85rem;color:#66757c}
.sheet .ttl{font-size:1.5rem;font-weight:600}
#printSheet{display:none}
@media print{
  body{background:#fff}
  .wrap{display:none}
  #printSheet{display:block;padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  if(i===3){var n=S.ideas.filter(function(x){return x.picked;}).length;if(S.ideas.length<5)m.push("떠오르는 내용 5개 이상 (지금 "+S.ideas.length+"개)");if(n<3)m.push("글에 쓸 내용 3가지 이상 선정 (지금 "+n+"개)");}

    var used=o.filter(function(r){return r.types.length;});if(!used.length)m.push("활용할 복합양식 자료 1개 이상");if(used.some(function(r){return !r.why.trim();}))m.push("자료를 고른 칸의 활용 이유");}

    var ns=S.blocks.filter(function(b){return b.type!=="text"&&filled(b)&&!b.own&&!(b.source||"").trim();}).length;if(ns)m.push("출처가 빠진 자료 "+ns+"개");}

  if(i===7){if(S.self.some(function(x){return x===null;}))m.push("나의 평가 6항목");if(S.peer.some(function(x){return x===null;}))m.push("친구의 평가 6항목");if(!S.good.trim()||!S.fix.trim())m.push("친구의 피드백");if(!S.revised.trim())m.push("고쳐 쓴 내용 기록");}

function tAdd(st){

  for(var i=0;i<T.list.length;i++){if(ukey(T.list[i].user)===k){if(n>=tInfo(T.list[i]).n)T.list[i]=st;return;}}
  T.list.push(st);

function tLoad(files){
  var i=0;
  (function next(){
    if(i>=files.length){T.list.sort(function(a,b){return (+a.user.ban-+b.user.ban)||(+a.user.num-+b.user.num);});render();toast("제출물 "+T.list.length+"명을 불러왔습니다.");return;}
    var f=files[i++],fr=new FileReader(),pdf=/\.pdf$/i.test(f.name)||f.type==="application/pdf";
    fr.onload=function(){
      try{var t=pdf?unpackPDF(fr.result):fr.result,d=JSON.parse(t);if(!d||d.v!==1||!d.user)throw 0;tAdd(Object.assign(fresh(),d));}
      catch(e){T.bad.push(f.name);}
      next();
    };
    fr.onerror=function(){T.bad.push(f.name);next();};
    if(pdf)fr.readAsArrayBuffer(f);else fr.readAsText(f);
  })();
}

function livePayload(){
  var d=JSON.parse(JSON.stringify(S));d.blocks.forEach(function(b){if(b.src){b.src="";b.hadImg=true;}});
  var done="",a=analyze();for(var i=0;i<9;i++)done+=missing(i).length?"0":"1";
  return JSON.stringify({action:"save",key:S.user.ban+"-"+S.user.num+"-"+S.user.name,ban:S.user.ban,num:S.user.num,name:S.user.name,step:S.step,done:done,chars:a.chars,mats:a.mats,noSrc:a.noSrc,data:JSON.stringify(d)});
}
function liveSend(beacon){
  if(!LIVE_URL||!S.user||T||LV||viewState)return;
  var p;try{p=livePayload();}catch(e){return;}
  if(p===liveLast)return;liveLast=p;
  if(beacon===true){try{navigator.sendBeacon(LIVE_URL,new Blob([p],{type:"text/plain;charset=utf-8"}));}catch(e){}return;}
  fetch(LIVE_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:p}).then(function(){if(liveOk!==true){liveOk=true;renderWho();}}).catch(function(){liveLast="";if(liveOk!==false){liveOk=false;renderWho();}});
}
function liveGet(q){return fetch(LIVE_URL+(LIVE_URL.indexOf("?")<0?"?":"&")+q+"&key="+encodeURIComponent(LV.key)+"&t="+Date.now()).then(function(r){return r.json();});}
function livePoll(){
  if(!LV||!LV.key)return;
  liveGet("action=list").then(function(d){
    if(!LV)return;
    if(d&&d.ok){LV.err="";LV.rows=d.rows||[];LV.now=d.now;LV.at=new Date();}
    else if(d&&d.error==="key"){LV.err="비밀번호가 다릅니다. 스크립트의 TEACHER_KEY와 같은지 확인하세요.";LV.key="";LV.rows=[];}
    else LV.err="목록을 읽지 못했습니다.";
    if(!viewState)render(true);
  }).catch(function(){if(!LV)return;LV.err="연결하지 못했습니다. 웹 앱 주소와 배포 설정(액세스 권한: 모든 사용자)을 확인하세요.";if(!viewState)render(true);});
}
function ago(ms){var s=Math.max(0,Math.round(ms/1000));return s<60?s+"초 전":Math.floor(s/60)+"분 전";}

  var top='<div class="head"><h2>교사용 · 실시간 보기</h2><span class="meta">'+(LV.at?"마지막 갱신 "+LV.at.toLocaleTimeString("ko-KR")+" · 10초마다 새로 읽음":"")+'</span></div>';
  if(!LIVE_URL)return '<div class="stack"><div class="card stack">'+top+'<div class="todo">실시간 보기가 아직 설정되지 않았습니다. 구글 시트에 스크립트를 배포한 뒤, 그 웹 앱 주소를 이 파일의 LIVE_URL에 넣어야 합니다.</div><div class="btns"><button class="btn" data-act="lclose">닫기</button></div></div></div>';
  if(!LV.key)return '<div class="stack"><div class="card stack">'+top+(LV.err?'<div class="todo">'+esc(LV.err)+'</div>':'')+'<label class="f" for="lv-key"><span>교사 비밀번호 <small>스크립트의 TEACHER_KEY에 적은 값</small></span><input type="text" id="lv-key" autocomplete="off"></label><div class="btns"><button class="btn pri" data-act="lstart">보기 시작</button><button class="btn" data-act="lclose">닫기</button></div></div></div>';
  var all=LV.rows.slice().sort(function(a,b){return (+a.ban-+b.ban)||(+a.num-+b.num);}),bans=[];

  var L=LV.filter?all.filter(function(r){return r.ban===LV.filter;}):all,now=LV.now||Date.now();
  var idle=L.filter(function(r){return now-r.updated>180000;}).length,per=[0,0,0,0,0,0,0,0,0];

  var rows=L.map(function(r){var q=now-r.updated,st=now-r.stepSince,dn=String(r.done||"");

  return '<div class="stack"><div class="card stack">'+top+(LV.err?'<div class="todo">'+esc(LV.err)+'</div>':'')+
    '<div class="btns">'+(bans.length>1?'<label for="lv-ban" style="font-size:.9rem">반</label><select id="lv-ban" style="width:auto"><option value="">전체</option>'+bans.map(function(b){return '<option value="'+esc(b)+'"'+(LV.filter===b?" selected":"")+'>'+esc(b)+'반</option>';}).join("")+'</select>':'')+'<button class="btn" data-act="lrefresh">지금 새로 읽기</button><button class="btn danger" data-act="lclear">'+(LV.arm?"정말 지울까요? 한 번 더 누르면 시트의 기록을 모두 지웁니다":"시트 기록 모두 지우기")+'</button><button class="btn" data-act="lclose">닫기</button></div>'+
    '<div class="tiles"><div class="tile"><b>'+L.length+'명</b><span>참여</span></div><div class="tile"><b>'+idle+'명</b><span>3분 넘게 입력 없음</span></div><div class="tile"><b>'+L.filter(function(r){return r.noSrc>0;}).length+'명</b><span>출처 빠진 자료 있음</span></div></div>'+
    '<div class="chips">'+STEPS.map(function(s,i){return '<span class="chip'+(per[i]?" on":"")+'" style="cursor:default">'+i+'. '+s.t+' '+per[i]+'명</span>';}).join("")+'</div></div>'+
    '<div class="card stack">'+(L.length?'<div class="tablebox"><table class="chk"><thead><tr><th>반-번호</th><th>이름</th><th>지금 단계</th><th>진행</th><th>글자 수</th><th>자료</th><th>출처 누락</th><th>마지막 입력</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div><p class="count">진행 칸은 0~8단계 순서입니다 · 한 단계에 10분 넘게 머물면 머문 시간이 표시됩니다</p>':'<p class="lead">아직 들어온 학생이 없습니다. 학생이 작가 등록을 하고 입력을 시작하면 20초 안에 나타납니다.</p>')+'</div></div>';
}

function saveFile(name,data){

var MARK="%BW10DATA:";
function packState(){var b=new TextEncoder().encode(JSON.stringify(S)),s="";for(var i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(s);}
function unpackPDF(buf){
  var t=new TextDecoder("latin1").decode(buf),k=t.lastIndexOf(MARK);if(k<0)return null;
  var e=t.indexOf("\n",k),s=atob(t.slice(k+MARK.length,e<0?t.length:e).trim()),b=new Uint8Array(s.length);
  for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);
  return new TextDecoder("utf-8").decode(b);
}

function makePDF(html,name){
  if(typeof html2canvas!=="function"||!window.jspdf){toast("PDF 기능을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로 고침 하세요.");return;}
  var box=document.createElement("div");box.className="sheet shot";box.innerHTML=html;document.body.appendChild(box);
  toast("PDF를 만드는 중입니다. 잠시 기다려 주세요.");
  var W=box.offsetWidth,kids=[].map.call(box.children,function(k){return [k.offsetTop,k.offsetTop+k.offsetHeight];});
  html2canvas(box,{scale:2,backgroundColor:"#ffffff"}).then(function(c){
    var k=c.width/W,pageH=Math.floor(c.width*277/190),H=c.height,y=0,cuts=[0];
    var edges=[];kids.forEach(function(b){edges.push(Math.round(b[0]*k),Math.round(b[1]*k));});
    while(H-y>pageH){
      var lim=y+pageH,cut=0;
      edges.forEach(function(e){if(e>y&&e<=lim&&e>cut)cut=e;});
      if(cut-y<pageH*0.3)cut=lim;
      y=cut;cuts.push(y);
    }
    cuts.push(H);
    var pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4"}),first=true;
    for(var i=0;i<cuts.length-1;i++){
      var h=cuts[i+1]-cuts[i];if(h<=0)continue;
      var pc=document.createElement("canvas");pc.width=c.width;pc.height=h;
      var g=pc.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,pc.width,h);g.drawImage(c,0,cuts[i],c.width,h,0,0,c.width,h);
      if(!first)pdf.addPage();first=false;
      pdf.addImage(pc.toDataURL("image/jpeg",0.9),"JPEG",10,10,190,h*190/c.width);
    }
    box.remove();saveFile(name,new Blob([pdf.output("blob"),"\n"+MARK+packState()+"\n"],{type:"application/pdf"}));
  }).catch(function(){box.remove();toast("PDF를 만들지 못했습니다. 선생님께 알려 주세요.");});
}
function loadImage(file,cb){
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();im.onload=function(){var m=1000,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);var g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",0.78));};im.onerror=function(){toast("이미지 파일을 열지 못했습니다.");};im.src=fr.result;};
  fr.onerror=function(){toast("파일을 읽지 못했습니다.");};
  fr.readAsDataURL(file);
}
