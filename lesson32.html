<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매체 자료 분석실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* 배치: 위쪽 단계 띠 + 한 단계씩 넘기는 작업 책상 */
  --bg:#f1f5f2; --surface:#ffffff; --ink:#1b2a31; --muted:#586b73; --line:#d3ddd9;
  --accent:#1c7a54; --accent-ink:#ffffff; --accent-soft:#def1e6; --mark:#ffe27a;
  --warn:#b8402a; --warn-soft:#fbe7e1;
  --display:"Do Hyeon","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11181b; --surface:#1a2428; --ink:#e5eeea; --muted:#9db1ad; --line:#2e3c41;
    --accent:#5fc798; --accent-ink:#0d1a14; --accent-soft:#1c392c; --mark:#7a6412;
    --warn:#f09079; --warn-soft:#3a211b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11181b; --surface:#1a2428; --ink:#e5eeea; --muted:#9db1ad; --line:#2e3c41;
  --accent:#5fc798; --accent-ink:#0d1a14; --accent-soft:#1c392c; --mark:#7a6412;
  --warn:#f09079; --warn-soft:#3a211b; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 64px}
header.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:16px 0 10px}
.brand{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.brand h1{font-size:1.7rem}
.brand span{color:var(--muted);font-size:.9rem}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:5px}
.dot.off{background:var(--warn)}
nav.steps{display:flex;gap:6px;overflow-x:auto;padding:6px 0 12px;align-items:center}
.lesson{flex:none;font-family:var(--display);font-size:.95rem;color:var(--muted);padding:0 4px 0 8px}
.lesson:first-child{padding-left:0}
.stepbtn{flex:none;display:flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.9rem;white-space:nowrap}
.stepbtn .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--bg);font-size:.75rem;font-variant-numeric:tabular-nums}
.stepbtn.done .n{background:var(--accent);color:var(--accent-ink)}
.stepbtn.cur{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.stepbtn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 220px;min-width:0}
.head{display:flex;gap:10px 16px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
.head h2{font-size:1.5rem}
.head .meta{color:var(--muted);font-size:.88rem}
.lead{color:var(--muted);max-width:65ch}
.keyq{background:var(--mark);color:#2b2300;border-radius:10px;padding:10px 14px;font-weight:500}
:root[data-theme="dark"] .keyq{color:#fff3c2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .keyq{color:#fff3c2}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.9rem;font-weight:500}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],input[type=url],textarea,select{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:9px 11px;font-weight:400}
textarea{resize:vertical;min-height:64px;line-height:1.6}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.danger{color:var(--warn)}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:4px}
.todo{background:var(--warn-soft);border-radius:10px;padding:10px 14px;font-size:.9rem}
.todo b{color:var(--warn)}
.ok{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:.9rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.9rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.q{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.q .fb{font-size:.9rem;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.88rem}
table.chk{width:100%;border-collapse:collapse;font-size:.92rem}
table.chk th,table.chk td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle}
table.chk th{color:var(--muted);font-weight:500;font-size:.85rem}
.tablebox{overflow-x:auto}
.rate{display:flex;gap:4px}
.rate button{width:36px;height:32px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer}
.rate button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.peerbar{background:var(--mark);color:#2b2300;border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.prog{display:inline-flex;gap:2px;vertical-align:middle}
.prog i{width:9px;height:14px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--accent)}
table.chk td.num{text-align:right;font-variant-numeric:tabular-nums}
table.chk .bad{color:var(--warn);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.tile b{display:block;font-family:var(--display);font-size:1.6rem;font-weight:400;line-height:1.2}
.tile span{font-size:.85rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.92rem;z-index:20;max-width:calc(100% - 32px)}
.hide{display:none!important}
ol.plan{margin:0;padding-left:20px;color:var(--muted)}
.sheet{background:#fff;color:#1d262b;font-family:var(--body);font-size:15px;line-height:1.6;padding:8px}
.sheet.shot{position:absolute;left:-10000px;top:0;width:794px}
.sheet .sec{padding:0 0 12px;break-inside:avoid}
.sheet h1{font-family:var(--body);font-weight:600;font-size:1.2rem;margin:0 0 4px}
.sheet h2{font-family:var(--body);font-weight:600;font-size:1rem;border-left:5px solid #1c7a54;padding-left:8px;margin:0 0 6px}
.sheet table{width:100%;border-collapse:collapse;font-size:.9rem}
.sheet th,.sheet td{border:1px solid #aab7b2;padding:6px 8px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.sheet th{background:#eef4f1;white-space:nowrap}
.sheet p{margin:0 0 6px;white-space:pre-wrap;overflow-wrap:anywhere}
.sheet .cap{font-size:.85rem;color:#66757c}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.lab{font-size:.9rem;font-weight:500}
.chip:disabled{cursor:default;opacity:.55}
.chip.on:disabled{opacity:1}
.chip.miss{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.q .fb.good{border-left-color:var(--accent);color:var(--ink)}
.q .fb.bad{border-left-color:var(--warn);color:var(--ink)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp>div{border:1px solid var(--line);border-radius:9px;padding:8px 12px;overflow-wrap:anywhere}
.cmp .ex{border-color:var(--accent);background:var(--accent-soft)}
.cmp small{color:var(--muted);font-size:.8rem}

.rate{align-items:center}
.cloze{font-size:1.05rem;line-height:2.2}
.bl{display:inline-block;min-width:84px;text-align:center;border-bottom:3px solid var(--muted);padding:0 6px;font-weight:600;color:var(--accent);line-height:1.5}
.bl.cur{border-color:var(--accent);background:var(--mark);border-radius:6px 6px 0 0}
.sheet small{color:#66757c}
.chip.static{cursor:default}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}

.tbp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:0}
.tbp .bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tbp .bar b{font-family:var(--display);font-weight:400;font-size:1.1rem;margin-right:4px}
.tbp .view{overflow:auto;border-radius:8px;background:#fff;min-height:200px;flex:1 1 auto}
.tbp .view img{display:block;width:100%;height:auto}
.tbp .view.zoom img{width:170%;max-width:none}
.tbp .ph{padding:28px 18px;color:#46565c;text-align:center;line-height:1.7}
.tbp.closed .view,.tbp.closed .note{display:none}
@media (max-width:999px){.tbp .view{max-height:55vh}}
.tbp .note{font-size:.8rem;color:var(--muted)}
.frame{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.post{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.post h3{font-size:1.1rem}
.scene{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px dashed var(--line);border-radius:9px;padding:6px 8px;background:var(--surface)}
.scene.in{border-style:solid;border-color:var(--accent)}
.scene.out{opacity:.75;text-decoration:line-through;text-decoration-color:var(--muted)}
.scene.bad{border:2px solid var(--warn);text-decoration:none;opacity:1}
.scene span{font-size:.92rem}
.scene .ph2{display:flex;gap:4px;flex:none}
.scene .chip{padding:3px 9px;font-size:.82rem}
.jig{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.jig button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;cursor:pointer}
.jig button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.jig button b{font-family:var(--display);font-weight:400;font-size:1.3rem;margin-right:6px;color:var(--accent)}
.mine{border-left:4px solid var(--accent);padding-left:10px}
.care{font-size:.88rem;background:var(--warn-soft);border-radius:9px;padding:7px 12px}
.oxrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.notice{border:2px solid var(--accent);border-radius:12px;padding:12px 16px;background:var(--accent-soft);font-size:.93rem;display:flex;flex-direction:column;gap:6px}
.notice ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.notice .ack{display:flex;gap:8px;align-items:center;font-weight:600;cursor:pointer}
.notice .ack input{width:20px;height:20px}
</style>
</head>

function htmlText(html){

  return ta.value.replace(/[ \t]+\|\s*\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
}

function makePDF(){

  var box=document.createElement("div");box.className="sheet shot";box.innerHTML=sheetHTML();document.body.appendChild(box);
  toast("PDF를 만드는 중입니다. 잠시 기다려 주세요.");

  html2canvas(box,{scale:2,backgroundColor:"#ffffff"}).then(function(c){
    var k=c.width/Wd,pageH=Math.floor(c.width*277/190),H=c.height,y=0,cuts=[0],edges=[];
    kids.forEach(function(b){edges.push(Math.round(b[0]*k),Math.round(b[1]*k));});
    while(H-y>pageH){var lim=y+pageH,cut=0;edges.forEach(function(e){if(e>y&&e<=lim&&e>cut)cut=e;});if(cut-y<pageH*0.3)cut=lim;y=cut;cuts.push(y);}
